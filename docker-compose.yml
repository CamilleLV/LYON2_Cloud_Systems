version: "3"

services:
  # --- NAME NODE (Le Chef) ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    ports:
      - 9870:9870 # Interface Web
      - 9000:9000 # Port RPC pour les datanodes et Spark
    volumes:
      - ./data/namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1 # Important: 1 seule copie car petit cluster
      - HDFS_CONF_dfs_permissions_enabled=false # Évite les erreurs de droits sur Windows

  # --- DATA NODE 1 (Ouvrier 1) ---
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    depends_on:
      - namenode
    volumes:
      - ./data/datanode1:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870

  # --- DATA NODE 2 (Ouvrier 2) ---
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    depends_on:
      - namenode
    volumes:
      - ./data/datanode2:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870

  # --- SPARK CLIENT (Le Cerveau) ---
  spark-client:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-client
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./input_data:/home/jovyan/work
    environment:
      - JUPYTER_TOKEN=bigdata
      # On dit à Spark où est le Namenode pour qu'il puisse lire les fichiers
      - SPARK_HADOOP_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - namenode

  # --- KERBEROS ---
  kerberos:
    image: gcavalcante8808/krb5-server
    container_name: kerberos
    hostname: kerberos.hadoop.docker
    environment:
      KRB5_REALM: "HADOOP.DOCKER"
      KRB5_KDC: "kerberos.hadoop.docker"
      KRB5_PASS: "password"
    ports:
      - "88:88"
      - "749:749"
    networks:
      default:
        aliases:
          - kerberos.hadoop.docker